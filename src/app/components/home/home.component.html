<div class="container">
  <h2>Student Database</h2>
  <div class="student-list">
    <table class="table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Class</th>
          <th>Gender</th>
          <th>Hobby</th>
          <th>Favorite Subject</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let student of students$ | async">
          <td>{{ student.name }}</td>
          <td>{{ student.class }}</td>
          <td>{{ student.gender }}</td>
          <td>{{ student.hasHobby ? student.hobby : 'No hobby' }}</td>
          <td>{{ student.favoriteSubject }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
